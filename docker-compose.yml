services:
  # Day-to-day development: live reload at http://localhost:5173
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Production check: built site served by nginx at http://localhost:8080
  web:
    build: .
    ports:
      - "8080:80"
    profiles: ["prod"]

volumes:
  node_modules:
